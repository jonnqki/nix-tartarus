"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

# Flat colour blocks. Every colour is a name from the "noctalia" palette at the
# bottom, which Noctalia rewrites whenever the theme changes.
add_newline = false
format = """
$username\
$directory\
$git_branch\
$git_status\
$nix_shell\
$cmd_duration\
$line_break$character"""

[username]
show_always = true
style_user = "bg:pink fg:crust bold"
style_root = "bg:red fg:crust bold"
format = "[ $user ]($style)"

[directory]
style = "bg:mauve fg:crust bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Branch and its status share one block: "  main ! "
[git_branch]
symbol = ""
style = "bg:surface1 fg:green bold"
format = "[ $symbol $branch]($style)[ ](bg:surface1)"

[git_status]
style = "bg:surface1 fg:yellow bold"
format = "([$all_status$ahead_behind ]($style))"

[nix_shell]
symbol = "❄"
style = "bg:surface0 fg:sky"
format = "[ $symbol $state ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:surface0 fg:peach"
format = "[ 󰔟 $duration ]($style)"

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"

# >>> NOCTALIA STARSHIP PALETTE >>>
# Noctalia Starship Palette
# Generated by Noctalia - do not edit manually

[palettes.noctalia]
