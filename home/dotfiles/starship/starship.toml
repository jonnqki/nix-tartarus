"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

# Powerline prompt in the spirit of agnoster. Every colour is a name from the
# "noctalia" palette below, which Noctalia rewrites whenever the theme changes.
add_newline = false
format = """
[](pink)\
$username\
[](bg:mauve fg:pink)\
$directory\
[](fg:mauve bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface0)\
$nix_shell\
$direnv\
$cmd_duration\
[ ](fg:surface0)\
$line_break$character"""

[username]
show_always = true
style_user = "bg:pink fg:crust bold"
style_root = "bg:red fg:crust bold"
format = "[ $user ]($style)"

[directory]
style = "bg:mauve fg:crust bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:surface1 fg:pink"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:surface1 fg:pink"
format = "[($all_status$ahead_behind )]($style)"

[nix_shell]
symbol = "❄"
style = "bg:surface0 fg:sky"
format = "[ $symbol $state ]($style)"

[direnv]
disabled = false
style = "bg:surface0 fg:green"
format = "[ $loaded ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:surface0 fg:peach"
format = "[ 󰔟 $duration ]($style)"

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"

# >>> NOCTALIA STARSHIP PALETTE >>>
