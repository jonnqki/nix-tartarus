pink      = "#aee1e2"
mauve     = "#b3c6ff"
maroon    = "#ffcbc5"
peach     = "#dbd2f7"
teal      = "#b0cccc"
sky       = "#c0dfc0"
sapphire  = "#f7c9f2"
