flamingo  = "#ffcbc5"
pink      = "#e1d0ff"
mauve     = "#d2bcff"
maroon    = "#ffcbc5"
peach     = "#ffc8e1"
teal      = "#b9c3ff"
sky       = "#c0dafc"
sapphire  = "#ffcea0"
