flamingo  = "#ffcbc5"
pink      = "#b5dcf8"
mauve     = "#a9c8fd"
maroon    = "#ffcbc5"
peach     = "#f9c8f1"
teal      = "#94cef3"
sky       = "#a1e2f0"
sapphire  = "#ffce97"
lavender  = "#b5dcf8"

# Text shades
text      = "#e4e1ed"
subtext1  = "#c7c4d7"
