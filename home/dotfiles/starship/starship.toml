yellow    = "#dddce4"
cyan      = "#b0b0b8"
magenta   = "#b5cbcb"
white     = "#c6c6cc"
black     = "#46464c"

# Extended palette (Catppuccin-compatible names)
rosewater = "#ededf9"
flamingo  = "#ffcbc5"
pink      = "#bcdede"
mauve     = "#b5cbcb"
maroon    = "#ffcbc5"
peach     = "#ededf9"
teal      = "#b0b0b8"
sky       = "#bfc0cc"
sapphire  = "#eecee5"
lavender  = "#bcdede"

# Text shades
text      = "#e5e2e3"
subtext1  = "#c6c6cc"
subtext0  = "#909096"

# Surface shades
overlay2  = "#909096"
overlay1  = "#909096"
overlay0  = "#46464c"
surface2  = "#46464c"
surface1  = "#46464c"
surface0  = "#131314"
base      = "#131314"
mantle    = "#131314"
crust     = "#131314"
