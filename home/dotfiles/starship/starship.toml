flamingo  = "#ffcbc5"
pink      = "#beded4"
mauve     = "#b6cbc4"
maroon    = "#ffcbc5"
peach     = "#eaedf7"
teal      = "#aeb0b7"
sky       = "#bdc1cb"
sapphire  = "#e9d0e7"
