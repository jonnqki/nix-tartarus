flamingo  = "#ffcbc5"
pink      = "#aae1e1"
mauve     = "#c9c0f4"
maroon    = "#ffcbc5"
peach     = "#ced7f5"
teal      = "#cac3da"
sky       = "#f5cbe2"
sapphire  = "#f4c9ff"
lavender  = "#aae1e1"

# Text shades
text      = "#e2e2e5"
