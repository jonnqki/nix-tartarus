black     = "#40484c"

# Extended palette (Catppuccin-compatible names)
rosewater = "#b9ddeb"
flamingo  = "#ffcbc5"
pink      = "#b8dbff"
mauve     = "#9accfb"
maroon    = "#ffcbc5"
peach     = "#b9ddeb"
teal      = "#b2ccc2"
sky       = "#b8dfd1"
sapphire  = "#d3d3ff"
lavender  = "#b8dbff"

# Text shades
text      = "#dee3e6"
subtext1  = "#bfc8cc"
subtext0  = "#8a9296"

# Surface shades
overlay2  = "#8a9296"
overlay1  = "#8a9296"
overlay0  = "#40484c"
surface2  = "#40484c"
surface1  = "#40484c"
surface0  = "#0f1416"
base      = "#0f1416"
