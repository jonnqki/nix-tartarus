flamingo  = "#ffcbc5"
pink      = "#aedfeb"
mauve     = "#c0c1ff"
maroon    = "#ffcbc5"
peach     = "#e6cefb"
teal      = "#d1c0e0"
sky       = "#ffce9a"
sapphire  = "#fec4ff"
lavender  = "#aedfeb"

# Text shades
text      = "#e2e2e7"
